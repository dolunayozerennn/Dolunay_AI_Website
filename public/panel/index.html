<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Giriş · dolunay.ai blog paneli</title>
<link rel="icon" href="marka/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stil.css">
</head>
<body>

<main class="giris-sayfa">
  <div class="giris-kutu">

    <div class="giris-basi">
      <span class="marka">
        <img src="marka/dolunay-ay.svg" alt="">
        <b>dolunay<i>.ai</i></b>
      </span>
      <h1>Blog panelinize girin</h1>
      <p>Yazılarınızı görmek, düzenlemek ve onaylamak için giriş yapın.</p>
    </div>

    <div class="form-uyari" id="formUyari" role="alert"></div>

    <form id="girisForm" novalidate>
      <div class="alan" id="alanEposta">
        <label for="eposta">E-posta</label>
        <input type="email" id="eposta" name="eposta" autocomplete="username"
               placeholder="ornek@buronuz.com" spellcheck="false">
        <p class="hata" id="hataEposta"></p>
      </div>

      <div class="alan" id="alanSifre">
        <label for="sifre">Şifre</label>
        <input type="password" id="sifre" name="sifre" autocomplete="current-password"
               placeholder="En az 6 karakter">
        <p class="hata" id="hataSifre"></p>
      </div>

      <button type="submit" class="btn btn-birincil btn-tam">Giriş Yap</button>
    </form>

    <div class="giris-alt">
      <p class="giris-ipucu">
        Aboneliğinizi başlatırken verdiğiniz e-posta ve belirlediğiniz şifreyle
        girin. Şifrenizi hatırlamıyorsanız
        <a href="mailto:dolunay@dolunay.ai">dolunay@dolunay.ai</a> adresine yazın.
      </p>
    </div>

  </div>
</main>

<script>
(function () {
  "use strict";

  /* Panel /panel/ altında, fonksiyonlar /.netlify/functions/ altında: aynı
     köken. Oturum çerezi bu yüzden doğrudan çalışıyor. */
  var GIRIS_UCU = "/.netlify/functions/giris";

  var form = document.getElementById("girisForm");
  var uyari = document.getElementById("formUyari");

  var alanlar = {
    eposta: {
      kutu: document.getElementById("alanEposta"),
      girdi: document.getElementById("eposta"),
      hata: document.getElementById("hataEposta"),
      dogrula: function (v) {
        if (!v) return "E-posta adresinizi yazın.";
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return "Geçerli bir e-posta adresi yazın.";
        return null;
      }
    },
    sifre: {
      kutu: document.getElementById("alanSifre"),
      girdi: document.getElementById("sifre"),
      hata: document.getElementById("hataSifre"),
      /* Burada uzunluk kuralı YOK. Bu bir giriş ekranı, kayıt değil:
         şifrenin kuralı hesap açılırken uygulandı. Burada uzunluk denetlemek
         hem gereksiz, hem de şifre kuralı hakkında bilgi sızdırır. */
      dogrula: function (v) {
        if (!v) return "Şifrenizi yazın.";
        return null;
      }
    }
  };

  function isaretle(alan, mesaj) {
    if (mesaj) {
      alan.kutu.classList.add("hatali");
      alan.hata.textContent = mesaj;
      alan.girdi.setAttribute("aria-invalid", "true");
    } else {
      alan.kutu.classList.remove("hatali");
      alan.hata.textContent = "";
      alan.girdi.removeAttribute("aria-invalid");
    }
    return !mesaj;
  }

  /* alandan çıkınca ve hata varken yazarken tekrar denetle */
  Object.keys(alanlar).forEach(function (ad) {
    var alan = alanlar[ad];
    alan.girdi.addEventListener("blur", function () {
      isaretle(alan, alan.dogrula(alan.girdi.value.trim()));
    });
    alan.girdi.addEventListener("input", function () {
      if (alan.kutu.classList.contains("hatali")) {
        isaretle(alan, alan.dogrula(alan.girdi.value.trim()));
      }
      uyari.classList.remove("acik");
    });
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    uyari.classList.remove("acik");

    var ilkHatali = null;
    var tamam = true;

    Object.keys(alanlar).forEach(function (ad) {
      var alan = alanlar[ad];
      var mesaj = alan.dogrula(alan.girdi.value.trim());
      if (!isaretle(alan, mesaj)) {
        tamam = false;
        if (!ilkHatali) ilkHatali = alan.girdi;
      }
    });

    if (!tamam) {
      uyari.textContent = "Eksik ya da hatalı alanlar var. Aşağıda işaretledik.";
      uyari.classList.add("acik");
      if (ilkHatali) ilkHatali.focus();
      return;
    }

    gonder();
  });

  function uyar(mesaj) {
    uyari.textContent = mesaj;
    uyari.classList.add("acik");
  }

  function gonder() {
    var dugme = form.querySelector('button[type="submit"]');
    var eskiMetin = dugme.textContent;
    dugme.disabled = true;
    dugme.textContent = "Giriş yapılıyor…";

    function bitir() {
      dugme.disabled = false;
      dugme.textContent = eskiMetin;
    }

    /* Şifre TRIMLENMEZ: baştaki ya da sondaki boşluk şifrenin parçası
       olabilir; hesap açılırken de kırpılmamıştı. E-posta kırpılır. */
    fetch(GIRIS_UCU, {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        eposta: alanlar.eposta.girdi.value.trim(),
        sifre: alanlar.sifre.girdi.value
      })
    }).then(function (cevap) {
      return cevap.json().catch(function () { return {}; }).then(function (veri) {
        return { kod: cevap.status, veri: veri };
      });
    }).then(function (s) {
      if (s.kod === 200 && s.veri.girisli === true) {
        /* Oturum çerezde; panel açılışta kendisi doğrulayacak. */
        window.location.href = "panel.html";
        return;
      }
      bitir();
      uyar(s.veri && s.veri.hata ? s.veri.hata : "Giriş yapılamadı. Birazdan tekrar deneyin.");
      alanlar.sifre.girdi.value = "";
      alanlar.sifre.girdi.focus();
    }).catch(function () {
      bitir();
      uyar("Sunucuya ulaşılamadı. Bağlantınızı kontrol edip tekrar deneyin.");
    });
  }
})();
</script>

</body>
</html>
