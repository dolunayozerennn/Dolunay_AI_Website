<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">

    </g>
    <g id="i-yazi" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/>

    <g id="i-konu" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 16.5 9 11l3.5 3.5L20.5 6.5"/><path d="M15.5 6.5h5v5"/>
    </g>
    <g id="i-marka" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6" fill="currentColor"/>

    </g>
    <g id="i-hesap" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8.2" r="3.7"/><path d="M4.8 20c.6-3.6 3.7-5.7 7.2-5.7s6.6 2.1 7.2 5.7"/>
    </g>
    <g id="i-yardim" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

<div class="panel-govde">

  <!-- ================= sol ray ================= -->
  <nav class="ray" aria-label="Panel menüsü">
    <a class="ray-marka" href="#" data-bolum="anasayfa" aria-label="Ana sayfa">
      <img src="marka/dolunay-ay.svg" alt="dolunay.ai">
    </a>

    <div class="ray-menu" id="rayMenu"></div>

    <div class="ray-menu ray-alt" id="rayMenuAlt"></div>
  </nav>

  <!-- ================= sağ taraf ================= -->
  <div style="flex:1;min-width:0">

    <header class="tepe">
      <h1 id="sayfaBasligi">Ana Sayfa</h1>
      <div class="tepe-sag" id="tepeSag"></div>
    </header>

    <main class="icerik">
      <div class="icerik-ic">

        <section class="bolum" id="b-anasayfa" data-baslik="Ana Sayfa"></section>

        <section class="bolum" id="b-posts" data-baslik="Yazılarım"></section>

        <section class="bolum" id="b-topics" data-baslik="Konular"></section>

        <section class="bolum" id="b-brand" data-baslik="Marka Profilim"></section>

        <section class="bolum" id="b-support" data-baslik="Destek"></section>

        <section class="bolum" id="b-account" data-baslik="Hesabım"></section>

        <!-- Yardım bu turda kapsam dışı: menüde duruyor, içi boş -->
        <section class="bolum" id="b-help" data-baslik="Yardım">
          <div class="bos-durum">
            <p>Yardım içeriği henüz hazırlanmadı.</p>
            <button class="btn btn-ikincil" data-git="support">Destek talebi oluştur</button>
          </div>
        </section>

      </div>
    </main>

  </div>
</div>

<div id="modalYuva"></div>
<div class="toast-alan" id="toastAlan" aria-live="polite" aria-atomic="false"></div>

<script src="data/mock.js"></script>
<script src="panel.js"></script>

</body>
</html>
