[build]
  # Netlify depoyu SIG KLONLA ceker. Sitemap'teki "son degisiklik" tarihi her sayfanin
  # kendi git gecmisinden okunuyor; sig klonda tum dosyalar tek commit tarihine yapisir
  # ve tarih sinyali yine anlamsizlasir. Bu yuzden build oncesi tam gecmis cekilir.
  # Cekilemezse build DURMAZ, sitemap kendi yedek zincirine (mtime -> simdi) duser.
  command = "git fetch --unshallow --quiet || true; npm run build"

  # Yalniz `seo_geo/` degisen commit siteyi yeniden KURMAZ. O klasor SEO/GEO
  # calisma defteri; hicbir dosyasi derlemeye girmiyor (yalniz yorum satirlarinda
  # adi geciyor), ama her dokumantasyon commit'i tam bir build yakiyordu ve
  # Netlify kredisi build DAKIKASINDAN dusuyor -- 18 Eylul'de kredi bu yuzden
  # bitip yayin komple durdu.
  #
  # Netlify sozlesmesi TERS: cikis 0 = build ATLANIR, sifir disi = build KOSAR.
  # `git diff --quiet` fark yoksa 0 doner, yani "seo_geo disinda hicbir sey
  # degismemis" demek build atlanir demektir. Sig klonda eski commit bulunamazsa
  # git hata verir, cikis sifir disi olur ve build KOSAR -- yanlis tarafa dusmez.
  #
  # Sinandi (iki yonde, gercek commit'lerle): 4b08b73 ve edbeda5 (yalniz seo_geo)
  # ATLA; 08aee0e, 60f7341 ve 3a0a0e6 (src degisikligi) KUR. 5/5.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)seo_geo'"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Abonelik odeme akisi. iyzico token'i 30 dakikada oluyor, bu yuzden odeme
# formu statik dosyadan degil her istekte fonksiyondan uretilir.
# Sira onemli: /odeme/sonuc once eslesmeli, yoksa yildiz onu da yutar.
[[redirects]]
  from = "/odeme/sonuc"
  to = "/.netlify/functions/abonelik-sonuc"
  status = 200
  force = true

[[redirects]]
  from = "/odeme/tek-sonuc"
  to = "/.netlify/functions/odeme-sonuc"
  status = 200
  force = true

[[redirects]]
  from = "/odeme/*"
  to = "/.netlify/functions/odeme-baslat?paket=:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self'; media-src 'self' blob: https://res.cloudinary.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Musteri paneli. EN SONDA duruyor: yukaridaki uzanti kurallari (/*.js, /*.css,
# /*.svg) panel dosyalarina da uyuyor ve bir yillik `immutable` onbellek veriyor.
# Next.js kendi dosya adlarini hash'liyor, onlarda bu dogru; ama panel.js ve
# stil.css sabit adli, bir yil onbelleklenirse guncelleme donen kullaniciya HIC
# ulasmaz. Bu blok sonra geldigi icin panel yollarinda o kurali eziyor.
#
# X-Robots-Tag: sayfalarda zaten <meta name="robots" content="noindex, nofollow">
# var; baslik, HTML disindaki dosyalari (js, css, svg, mock verisi) de kapsasin
# diye burada tekrarlaniyor. robots.txt tarafi src/app/robots.ts icinde.
[[headers]]
  for = "/panel/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
