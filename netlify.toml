[build]
  # Netlify depoyu SIG KLONLA ceker. Sitemap'teki "son degisiklik" tarihi her sayfanin
  # kendi git gecmisinden okunuyor; sig klonda tum dosyalar tek commit tarihine yapisir
  # ve tarih sinyali yine anlamsizlasir. Bu yuzden build oncesi tam gecmis cekilir.
  # Cekilemezse build DURMAZ, sitemap kendi yedek zincirine (mtime -> simdi) duser.
  #
  # surum.txt: canlidaki commit. Gece yayini (scripts/gece_yayini.sh) main ile
  # bunu karsilastirip fark yoksa yayin tetiklemez.
  command = "git fetch --unshallow --quiet || true; npm run build && printf '%s\\n' \"$COMMIT_REF\" > out/surum.txt"

  # GECE TOPLU YAYIN (2026-09-18). Basarili her production yayini 15 Netlify
  # kredisi yakar (build dakikasi degil); 18 Eylul'de kredi bu yuzden bitip
  # yayin komple durdu. Artik gun ici push'lar yayina CIKMAZ: kapi onlari iptal
  # eder (iptal bedava), gece 03:00'te .github/workflows/gece-yayini.yml canli
  # surum ile main'i karsilastirir ve fark varsa TEK yayin tetikler. Yalniz
  # `seo_geo/` degistiyse o gece de yayin olmaz.
  #
  # ACIL IS: commit mesajina (PR'da birlestirme basligina) `[yayinla]` yaz, o
  # push hemen yayina cikar. Ya da GitHub'da Actions > Gece yayini > Run workflow.
  # Netlify arayuzundeki "Trigger deploy" ATLANIR, kullanma.
  #
  # Onizleme ve dal yayinlari etkilenmez (bedava). Kural ayrintisi kapinin icinde.
  ignore = "bash scripts/netlify_yayin_kapisi.sh"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Abonelik odeme akisi. iyzico token'i 30 dakikada oluyor, bu yuzden odeme
# formu statik dosyadan degil her istekte fonksiyondan uretilir.
# Sira onemli: /odeme/sonuc once eslesmeli, yoksa yildiz onu da yutar.
[[redirects]]
  from = "/odeme/sonuc"
  to = "/.netlify/functions/abonelik-sonuc"
  status = 200
  force = true

[[redirects]]
  from = "/odeme/tek-sonuc"
  to = "/.netlify/functions/odeme-sonuc"
  status = 200
  force = true

[[redirects]]
  from = "/odeme/*"
  to = "/.netlify/functions/odeme-baslat?paket=:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://bzrcdn.openai.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://bzr.openai.com https://bzrcdn.openai.com; media-src 'self' blob: https://res.cloudinary.com https://medya.dolunay.ai; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Musteri paneli. EN SONDA duruyor: yukaridaki uzanti kurallari (/*.js, /*.css,
# /*.svg) panel dosyalarina da uyuyor ve bir yillik `immutable` onbellek veriyor.
# Next.js kendi dosya adlarini hash'liyor, onlarda bu dogru; ama panel.js ve
# stil.css sabit adli, bir yil onbelleklenirse guncelleme donen kullaniciya HIC
# ulasmaz. Bu blok sonra geldigi icin panel yollarinda o kurali eziyor.
#
# X-Robots-Tag: sayfalarda zaten <meta name="robots" content="noindex, nofollow">
# var; baslik, HTML disindaki dosyalari (js, css, svg, mock verisi) de kapsasin
# diye burada tekrarlaniyor. robots.txt tarafi src/app/robots.ts icinde.
[[headers]]
  for = "/panel/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Yonetim ekrani (Savas'in musteri listesi). Musteri panelinden ayri, ayni
# gerekceyle en sonda: sayfa sabit adli, onbellege alinmamali. Sayfada
# musteri verisi yok; veri YONETIM_SIRRI isteyen yonetim-veri ucundan gelir.
# Baska bir siteye cerceve olarak gomulmez, yonlendiren adresi sizdirmaz.
[[headers]]
  for = "/yonetim"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/yonetim/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
